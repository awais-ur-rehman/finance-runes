[workspace]
resolver = "3"
members = [
    "crates/finance-app",
    "crates/finance-core",
    "crates/finance-import",
    "crates/finance-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["awais-ur-rehman"]
repository = "https://github.com/awais-ur-rehman/finance-runes"

[workspace.dependencies]
thiserror = "2.0"
time = "0.3"
uuid = "1.10"
proptest = "1.5"
csv = "1.3"
